<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Lilex + IBM Plex Sans JP Font -->
  <alias>
    <family>Lilex</family>
    <prefer>
      <family>Lilex</family>
      <family>IBM Plex Sans JP</family>
    </prefer>
  </alias>
  <alias>
    <family>Lilex ExtraLight</family>
    <prefer>
      <family>Lilex ExtraLight</family>
      <family>IBM Plex Sans JP ExtLt</family>
    </prefer>
  </alias>
  <alias>
    <family>Lilex ExtraThick</family>
    <prefer>
      <family>Lilex ExtraThick</family>
      <family>IBM Plex Sans JP SmBld</family>
    </prefer>
  </alias>
  <alias>
    <family>Lilex Medium</family>
    <prefer>
      <family>Lilex Medium</family>
      <family>IBM Plex Sans JP Medm</family>
    </prefer>
  </alias>
  <alias>
    <family>Lilex SemiBold</family>
    <prefer>
      <family>Lilex SemiBold</family>
      <family>IBM Plex Sans JP SmBld</family>
    </prefer>
  </alias>
  <alias>
    <family>Lilex Thin</family>
    <prefer>
      <family>Lilex Thin</family>
      <family>IBM Plex Sans JP Thin</family>
    </prefer>
  </alias>
</fontconfig>
